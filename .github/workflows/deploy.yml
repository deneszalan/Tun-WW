# Publishes Tunisia 1943 (Tunisie 1943), an app built from the Reckon code in deneszalan/instasmart: its posts live
# there in editions/tunisia/. This builds instasmart's main branch with `vite build --mode tunisia` and publishes the
# result here, at https://deneszalan.github.io/Tun-WW/. A push to this repository publishes the instasmart commit
# named in `instasmart.sha` (write a new commit there to publish it); the hourly run and a run by hand
# (Actions → Deploy → Run workflow) publish instasmart's main branch, the hourly one only when it has changed.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # A change to this repository (such as this workflow) publishes too.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      ready: ${{ steps.sha.outputs.ready }}
      published: ${{ steps.last.outputs.cache-hit }}
    steps:
      # Until the Tunisia app is on instasmart's main branch there is nothing to publish (`--mode tunisia` would build
      # instasmart's main app instead), so the build waits for its folder to appear.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: instasmart.sha
          sparse-checkout-cone-mode: false
      - id: sha
        run: |
          if [ "${{ github.event_name }}" = push ] && [ -s instasmart.sha ]; then
            sha=$(tr -d '[:space:]' < instasmart.sha)
          else
            sha=$(git ls-remote https://github.com/deneszalan/instasmart refs/heads/main | cut -f1)
          fi
          echo "Publishing instasmart $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null "https://raw.githubusercontent.com/deneszalan/instasmart/$sha/editions/tunisia/README.md"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "instasmart's main branch has no Tunisia app yet: nothing to publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      # A cache entry named after the commit marks it as published.
      - id: last
        uses: actions/cache/restore@v4
        with:
          path: .published
          key: published-${{ steps.sha.outputs.sha }}
          lookup-only: true

  build:
    needs: check
    if: needs.check.outputs.ready == 'true' && (needs.check.outputs.published != 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: deneszalan/instasmart
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content
      - run: npx vite build --mode tunisia
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tunisia

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: mkdir -p .published && echo "${{ needs.check.outputs.sha }}" > .published/sha
      - uses: actions/cache/save@v4
        with:
          path: .published
          key: published-${{ needs.check.outputs.sha }}
